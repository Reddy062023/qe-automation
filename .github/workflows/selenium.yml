name: Selenium Tests - QE Automation

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Run Selenium tests
        working-directory: selenium-retail
        run: mvn clean test

      - name: Upload Surefire reports
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: selenium-surefire-report
          path: selenium-retail/target/surefire-reports/
          retention-days: 30